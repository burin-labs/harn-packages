name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns this generated dispatch adapter.
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/bump-harn.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@f7ddcbefb215ef520651830f76bf266e20568ba5
    with:
      orchestration-sha: f7ddcbefb215ef520651830f76bf266e20568ba5
      version: ${{ inputs.version }}
      # The index has no harn.toml and no generated sources. The bump's version-file
      # write is the whole refresh, so the inherited package install must not run.
      refresh-command: test -f harn-package-index.toml
      validate-command: |-
        set -eu
        harn package registry verify harn-package-index.toml
        harn test reconcile-index.test.harn
        bash -n scripts/propose-index-drift.sh
      publish-failure-for-repair: true
      apply-behavior-preserving-fixes: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
