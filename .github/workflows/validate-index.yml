name: Validate index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e7898bd182a38422f9e012c63c8cd4c61d254932
      - name: Validate package index
        run: >-
          harn package registry verify harn-package-index.toml
          --remote --receipt-out registry-verification.json
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-verification
          path: registry-verification.json
          if-no-files-found: error
