name: Validate index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@6b541c0b50fb9c5dfab994ecb118ee1ea6004b44
      - name: Validate package index
        run: >-
          harn package registry verify harn-package-index.toml
          --remote --receipt-out registry-verification.json

      - name: Test the reconciler
        run: harn test reconcile-index.test.harn

      - name: Check the proposal script
        # Only the reconcile job ever runs this, and only when it finds drift.
        # A syntax error would otherwise surface days later, in a job nobody is
        # watching, as a proposal that never opened.
        run: bash -n scripts/propose-index-drift.sh
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-verification
          path: registry-verification.json
          if-no-files-found: error
