name: Validate index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@c86406a580b5a733a129a0c232e6d319a1745f23
      - name: Validate package index
        run: >-
          harn package registry verify harn-package-index.toml
          --remote --receipt-out registry-verification.json
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-verification
          path: registry-verification.json
          if-no-files-found: error
