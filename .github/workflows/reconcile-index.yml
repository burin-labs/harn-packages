name: Reconcile index

# Nothing else observes the gap between an upstream release tag and this
# index: `harn publish` is author-invoked and wired into no release pipeline,
# so drift is bounded only by when someone last looked
# (burin-labs/harn-github-connector#289). This job is that observer.

on:
  schedule:
    # Daily at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-index
  cancel-in-progress: false

jobs:
  reconcile:
    name: Upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `persist-credentials: false` is load-bearing, not hygiene. The default
      # writes an `http.extraheader` into `.git/config` that points at a
      # credentials file under RUNNER_TEMP. That path is outside the Harn
      # sandbox's read roots, so every `git ls-remote` the reconciler runs from
      # this directory dies with "bad config line 12 in file .git/config".
      # This job only reads public repositories and pushes nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@c86406a580b5a733a129a0c232e6d319a1745f23

      - name: Reconcile index against upstream tags
        shell: bash
        run: |
          # pipefail matters here: without it `tee` would mask a drift exit
          # code and this gate would pass while reporting drift.
          set -euo pipefail
          harn run --allow-process-network reconcile-index.harn 2>&1 \
            | tee reconcile-index.log

      - name: Upload reconcile log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconcile-index-log
          path: reconcile-index.log
          if-no-files-found: error
